<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>OG image — Kevin Cepeda</title>
    <style>
        :root {
            --bg: #0b0f14;
            --surface: #11161d;
            --surface-2: #161d26;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #22d3ee;
            --accent-2: #34d399;
            --border: #1f2937;
            --border-strong: #2d3748;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background-color: var(--bg);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            color: var(--text);
        }

        .glow {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 12% 8%, rgba(34, 211, 238, 0.16), transparent 45%),
                radial-gradient(circle at 88% 92%, rgba(52, 211, 153, 0.14), transparent 45%);
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 40%, #000 35%, transparent 78%);
        }

        .terminal {
            position: absolute;
            left: 80px;
            top: 105px;
            width: 1040px;
            height: 420px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 54px;
            padding: 0 22px;
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .r { background-color: #ff5f57; }
        .y { background-color: #febc2e; }
        .g { background-color: #28c840; }

        .path {
            margin-left: 12px;
            font-family: Consolas, "JetBrains Mono", ui-monospace, monospace;
            font-size: 16px;
            color: var(--muted);
        }

        .path b { color: var(--accent-2); font-weight: 600; }

        .body {
            display: flex;
            align-items: center;
            gap: 34px;
            height: 366px;
            padding: 0 48px;
        }

        .avatar {
            width: 128px;
            height: 128px;
            border-radius: 26px;
            display: grid;
            place-items: center;
            border: 2px solid var(--border-strong);
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(52, 211, 153, 0.18));
            font-family: Consolas, ui-monospace, monospace;
            font-size: 52px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            flex: 0 0 auto;
        }

        h1 {
            font-size: 62px;
            font-weight: 800;
            letter-spacing: -1.6px;
            line-height: 1.02;
        }

        .role {
            margin-top: 10px;
            font-family: Consolas, "JetBrains Mono", ui-monospace, monospace;
            font-size: 23px;
            color: var(--muted);
        }

        .role span { color: var(--accent); }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 26px;
        }

        .chip {
            font-family: Consolas, "JetBrains Mono", ui-monospace, monospace;
            font-size: 17px;
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 7px 14px;
        }

        .chip.hot { color: var(--accent); border-color: rgba(34, 211, 238, 0.55); }

        .footer {
            position: absolute;
            left: 80px;
            right: 80px;
            bottom: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: Consolas, "JetBrains Mono", ui-monospace, monospace;
            font-size: 18px;
            color: var(--muted);
        }

        .footer .url { color: var(--accent); }

        .status { display: flex; align-items: center; gap: 10px; }
        .pulse {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: var(--accent-2);
            box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.18);
        }
    </style>
</head>

<body>
    <div class="glow"></div>
    <div class="grid"></div>

    <div class="terminal">
        <div class="bar">
            <span class="dot r"></span>
            <span class="dot y"></span>
            <span class="dot g"></span>
            <span class="path">kevin@guayaquil:~$ <b>whoami</b></span>
        </div>

        <div class="body">
            <div class="avatar">KC</div>
            <div>
                <h1>Kevin Cepeda</h1>
                <p class="role"><span>&gt;</span> Full Stack Developer · .NET 8 &amp; Angular</p>
                <div class="chips">
                    <span class="chip hot">Banca</span>
                    <span class="chip hot">Seguridad</span>
                    <span class="chip">Observabilidad</span>
                    <span class="chip">Azure DevOps</span>
                    <span class="chip">Angular 21</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span class="status"><span class="pulse"></span> Disponible para oportunidades</span>
        <span class="url">cyborgk27.github.io/cv</span>
    </div>
</body>

</html>
