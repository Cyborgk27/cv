name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar LibreOffice y fuentes compatibles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer fonts-liberation fonts-crosextra-carlito poppler-utils

      - name: Validar sincronización del sitio
        run: python scripts/build.py --check

      - name: Generar CV (sitio + PDF)
        run: python scripts/build.py

      - name: Verificar paginación del PDF (máximo 2 páginas)
        run: |
          pages=$(pdfinfo dist/Kevin_Cepeda_CV.pdf | awk '/^Pages:/ {print $2}')
          echo "Páginas del PDF: $pages"
          test "$pages" -le 2

      - name: Preparar artefacto de Pages
        run: |
          mkdir -p _site
          cp -r index.html robots.txt sitemap.xml site.webmanifest css js assets dist _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
